[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "claimbreaker"
version = "0.1.0"
description = "An evidence observatory for human-led research verification"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "python-multipart>=0.0.20,<1",
  "pydantic>=2.10,<3", "pydantic-settings>=2.8,<3", "sqlalchemy>=2.0,<3", "alembic>=1.15,<2",
  "psycopg[binary]>=3.2,<4", "httpx>=0.28,<1", "itsdangerous>=2.2,<3",
  "numpy>=2.1,<3", "pandas>=2.2,<3", "scikit-learn>=1.6,<2", "scipy>=1.15,<2",
  "pypdf>=5,<7", "pdfplumber>=0.11,<1", "pypdfium2>=4.30,<6", "nbformat>=5.10,<6",
  "pyyaml>=6,<7", "reportlab>=4.3,<5", "openai>=1.75,<3", "e2b>=2,<3"
]
[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-asyncio>=0.26,<2"]
dev = ["ruff==0.17.1"]
[tool.ruff]
line-length = 100
target-version = "py312"
[tool.setuptools.packages.find]
where = ["backend"]
[tool.setuptools.package-data]
claimbreaker = ["assets/fonts/*.ttf", "assets/fonts/LICENSE*.txt"]
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
