name: Verify ClaimBreaker
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements*.lock
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: pip install -r requirements.lock -r requirements.test.lock && pip install --no-deps -e .
      - run: npm ci --legacy-peer-deps
      - run: python -m pytest -q
      - run: npm test && npm run build
      - run: npx playwright install --with-deps chromium
      - name: Browser acceptance
        env:
          CB_BROWSER: chromium
          CB_RUNNER: none
        run: |
          python -m uvicorn claimbreaker.app:app --host 127.0.0.1 --port 8000 >server.log 2>&1 &
          python -c "import time,urllib.request; time.sleep(3); urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/ready',timeout=15)"
          npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: verification-failure
          path: |
            playwright-report/
            test-results/
            server.log
